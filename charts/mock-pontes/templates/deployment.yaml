apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mock-pontes.fullname" . }}
  labels:
    {{- include "mock-pontes.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mock-pontes.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mock-pontes.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mock-pontes.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "mock-pontes.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: https
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            - name: HOST
              value: {{ .Values.config.host | quote }}
            - name: NODE_ENV
              value: {{ .Values.config.nodeEnv | quote }}
            - name: TLS_SAN
              value: {{ printf "dns:localhost;ip:127.0.0.1;dns:%s;dns:%s.%s.svc.cluster.local%s"
                (include "mock-pontes.fullname" .)
                (include "mock-pontes.fullname" .)
                .Release.Namespace
                (ternary (printf ";%s" .Values.config.extraTlsSan) "" (ne .Values.config.extraTlsSan "")) | quote }}
            {{- with .Values.config.tlsSubject }}
            - name: TLS_SUBJECT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.redisUrl }}
            - name: REDIS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.defaultNcb }}
            - name: PONTES_DEFAULT_NCB
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.externalUrl }}
            - name: PUBLIC_EXTERNAL_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.config.businessWindowAlwaysOpen }}
            - name: PONTES_MOCK_BUSINESS_WINDOW_ALWAYS_OPEN
              value: "true"
            {{- end }}
            {{- if .Values.tls.existingSecret }}
            - name: TLS_CERT_FILE
              value: {{ printf "%s/%s" .Values.tls.mountPath .Values.tls.certKey | quote }}
            - name: TLS_KEY_FILE
              value: {{ printf "%s/%s" .Values.tls.mountPath .Values.tls.keyKey | quote }}
            {{- end }}
            {{- if or .Values.admin.token .Values.admin.existingSecret }}
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "mock-pontes.adminSecretName" . }}
                  key: {{ .Values.admin.existingSecretKey }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: https
              scheme: HTTPS
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: https
              scheme: HTTPS
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.tls.existingSecret }}
            - name: tls
              mountPath: {{ .Values.tls.mountPath }}
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- if .Values.tls.existingSecret }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.existingSecret }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
