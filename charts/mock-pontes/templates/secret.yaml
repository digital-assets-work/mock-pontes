{{- if and .Values.admin.token (not .Values.admin.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mock-pontes.adminSecretName" . }}
  labels:
    {{- include "mock-pontes.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Gates the mock's admin surface (POST /admin/reset, POST /admin/business-window,
  # GET /admin/enrolled-users) and shortens CSR-issued certs to 1h.
  {{ .Values.admin.existingSecretKey }}: {{ .Values.admin.token | quote }}
{{- end }}
