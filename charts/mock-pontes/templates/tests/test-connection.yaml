apiVersion: v1
kind: Pod
metadata:
  name: {{ include "mock-pontes.fullname" . }}-test-connection
  labels:
    {{- include "mock-pontes.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: health-check
      image: curlimages/curl:8.11.0
      # The mock serves HTTPS with its own certificate; -k skips verification for
      # this in-cluster smoke test. Fails (non-zero) if health isn't reachable.
      command: ["curl"]
      args:
        - "-sSf"
        - "-k"
        - "https://{{ include "mock-pontes.fullname" . }}:{{ .Values.service.port }}{{ .Values.probes.path }}"
